name: tests

# Runs the whole test suite (every documented CLI option and check) on every
# push and PR, on the oldest Python the README promises and on current Python.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: arm64
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Test suite (python ${{ matrix.python }}, capped container)
        env:
          # These tests drive real containers on the CI host's own Docker engine.
          EXTRA_DOCKER_ARGS: -v /var/run/docker.sock:/var/run/docker.sock
        run: sh ci/run-tests.sh "${{ matrix.python }}"
